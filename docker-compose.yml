services:
  ollama:
    image: ollama/ollama:0.33.3
    container_name: ollama
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_RESOURCE
    read_only: false
    restart: unless-stopped
    environment:
      - OLLAMA_CONTEXT_LENGTH=65536
      - OLLAMA_KV_CACHE_TYPE=f16
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./modelfiles:/modelfiles:ro   # read-only mount
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.11.3
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "3080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open_webui_data:/app/backend/data

networks:
  default:
    name: llm-net

volumes:
  ollama_data:
  open_webui_data: